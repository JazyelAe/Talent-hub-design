<!doctype html>
<html lang="es" data-root="./">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vacantes · TalentHub (réplica de portafolio)</title>
  <meta name="description" content="Vacantes de TI ficticias con sueldo visible: busca y filtra por tecnología, nivel, modalidad y rango salarial.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:opsz,wght@9..40,100..1000&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pages/vacantes.css">
</head>
<body data-page="vacantes">
  <main id="contenido" tabindex="-1">
    <header class="band band--explorar">
      <div class="container">
        <h1 class="band__title">Vacantes</h1>
        <p class="band__lead" id="contador" aria-live="polite">Cargando vacantes…</p>
      </div>
    </header>

    <!-- Barra de búsqueda y filtros: se queda bajo la nav al hacer scroll -->
    <form class="filtros" id="filtros" role="search" aria-label="Buscar y filtrar vacantes">
      <div class="container filtros__inner">
        <div class="filtros__fila">
          <div class="control filtros__q">
            <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-magnifying-glass"></use></svg>
            <label class="sr-only" for="f-q">Puesto, empresa o tecnología</label>
            <input class="input" id="f-q" name="q" type="search" placeholder="Puesto, empresa o tecnología" autocomplete="off">
          </div>
          <div class="control filtros__lugar">
            <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-map-pin"></use></svg>
            <label class="sr-only" for="f-lugar">Ciudad o remoto</label>
            <input class="input" id="f-lugar" name="lugar" type="search" placeholder="Ciudad o remoto" autocomplete="off" list="ciudades">
            <datalist id="ciudades"></datalist>
          </div>
          <div class="filtros__modalidad" role="group" aria-label="Modalidad">
            <button class="chip" type="button" data-modalidad="" aria-pressed="true">Todas</button>
            <button class="chip" type="button" data-modalidad="remoto" aria-pressed="false">Remoto</button>
            <button class="chip" type="button" data-modalidad="hibrido" aria-pressed="false">Híbrido</button>
            <button class="chip" type="button" data-modalidad="presencial" aria-pressed="false">Presencial</button>
          </div>
          <button class="btn btn--ghost btn--sm filtros__mas" type="button" aria-expanded="false" aria-controls="filtros-extra">
            <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-sliders-horizontal"></use></svg>Más filtros<span class="chip__count" id="extra-n" hidden></span>
          </button>
        </div>
        <div class="filtros__fila filtros__extra" id="filtros-extra">
          <div class="field filtros__sel">
            <label class="field__label" for="f-tec">Tecnología</label>
            <select class="select" id="f-tec" name="tec"><option value="">Todas</option></select>
          </div>
          <div class="field filtros__sel">
            <label class="field__label" for="f-nivel">Nivel</label>
            <select class="select" id="f-nivel" name="nivel">
              <option value="">Todos</option><option value="Jr">Junior</option><option value="Mid">Mid</option><option value="Sr">Senior</option>
            </select>
          </div>
          <fieldset class="rango" id="rango">
            <legend class="field__label">Rango salarial mensual <output class="rango__valor" id="rango-valor" for="f-smin f-smax">Cualquiera</output></legend>
            <div class="rango__pista">
              <span class="rango__relleno" id="rango-relleno"></span>
              <label class="sr-only" for="f-smin">Sueldo mínimo</label>
              <input type="range" id="f-smin" name="smin" step="1000">
              <label class="sr-only" for="f-smax">Sueldo máximo</label>
              <input type="range" id="f-smax" name="smax" step="1000">
            </div>
          </fieldset>
          <button class="btn btn--text filtros__limpiar" type="button" id="limpiar" hidden>
            <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-x"></use></svg>Limpiar filtros
          </button>
        </div>
      </div>
    </form>

    <section class="container resultados" aria-labelledby="res-titulo">
      <h2 class="sr-only" id="res-titulo" tabindex="-1">Resultados</h2>
      <div class="grid grid--2 resultados__lista" id="lista"></div>
      <nav class="paginacion" id="paginacion" aria-label="Páginas de resultados" hidden></nav>
    </section>
  </main>
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/pages/vacantes.js"></script>
</body>
</html>
