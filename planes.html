<!doctype html>
<html lang="es" data-root="./">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planes · TalentHub (réplica de portafolio)</title>
  <meta name="description" content="Planes para empresas y aspirantes. Réplica de portafolio: no se procesan pagos.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:opsz,wght@9..40,100..1000&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pages/planes.css">
</head>
<body data-page="planes">
  <main id="contenido" tabindex="-1">
    <header class="band band--venta">
      <div class="container">
        <h1 class="band__title">Planes</h1>
        <p class="band__lead">Elige el plan de tu cuenta. Puedes cambiarlo después.</p>
      </div>
    </header>

    <div class="container planes">
      <ul class="garantias glass-panel overlap-sm" role="list">
        <li><span class="garantias__icono"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-lock-simple"></use></svg></span>Sin permanencia</li>
        <li><span class="garantias__icono"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-lightning"></use></svg></span>Cambio al momento</li>
        <li><span class="garantias__icono"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-currency-dollar"></use></svg></span>Pago con PayPal <span class="garantias__nota">(no disponible en la demo)</span></li>
      </ul>

      <section class="planes__grupo" aria-labelledby="pl-empresas">
        <h2 id="pl-empresas">Para empresas</h2>
        <div class="planes__grid" id="planes-empresas"><div class="plan sk" style="height:300px"></div></div>
      </section>
      <section class="planes__grupo" aria-labelledby="pl-aspirantes">
        <h2 id="pl-aspirantes">Para aspirantes</h2>
        <div class="planes__grid planes__grid--2" id="planes-aspirantes"><div class="plan sk" style="height:300px"></div></div>
      </section>
    </div>
  </main>
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/pages/planes.js"></script>
</body>
</html>
