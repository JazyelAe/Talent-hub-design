<!doctype html>
<html lang="es" data-root="./">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recupera tu contraseña · TalentHub (réplica de portafolio)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:opsz,wght@9..40,100..1000&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="recuperar" data-sin-nav>
  <main id="contenido" class="auth">
    <div class="auth__col">
      <a class="brand" href="index.html" aria-label="TalentHub, inicio"><span class="brand__mark" aria-hidden="true">th</span><span class="brand__name">TalentHub</span></a>
      <section class="auth__card" aria-labelledby="rec-t" id="rec-card">
        <h1 class="auth__titulo" id="rec-t">Recupera tu contraseña</h1>
        <p class="auth__sub">Escribe el correo de tu cuenta y te enviaremos un enlace para crear una nueva.</p>
        <div id="aviso-demo"></div>
        <form class="form" id="form-recuperar">
          <div class="field">
            <label class="field__label" for="r-correo">Correo electrónico</label>
            <div class="control"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-envelope-simple"></use></svg>
              <input class="input" id="r-correo" name="correo" type="email" required autocomplete="email" placeholder="nombre@dominio.com"></div>
          </div>
          <button class="btn btn--primary btn--block" type="submit"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-paper-plane-tilt"></use></svg>Enviar enlace</button>
        </form>
      </section>
      <p class="auth__pie"><a href="login.html">Volver a iniciar sesión</a></p>
    </div>
  </main>
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
