<!doctype html>
<html lang="es" data-root="./">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages sirve esta página en cualquier ruta inexistente: se fija la base del sitio
       para que las rutas relativas (CSS, JS, enlaces) apunten a la raíz del proyecto. -->
  <script>
    (function () {
      var m = location.pathname.match(/^\/Talent-hub-design\//i);
      document.write('<base href="' + (m ? m[0] : "/") + '">');
    })();
  </script>
  <title>Página no encontrada · TalentHub (réplica de portafolio)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:opsz,wght@9..40,100..1000&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pages/legal.css">
</head>
<body data-page="404">
  <main id="contenido" tabindex="-1" class="nf">
    <div class="nf__inner">
      <!-- El número es ilustración, no titular: oculto para lectores de pantalla -->
      <p class="nf__num" aria-hidden="true">404</p>
      <h1>Esta página no existe</h1>
      <p class="nf__texto">Puede que el enlace esté mal escrito o que la página haya cambiado de lugar.</p>
      <div class="cluster nf__acciones">
        <a class="btn btn--primary" href="vacantes.html"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-arrow-right"></use></svg>Ver vacantes</a>
        <a class="btn btn--ghost" href="index.html"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-arrow-left"></use></svg>Ir al inicio</a>
      </div>
      <form class="nf__buscar" action="vacantes.html" method="get" role="search">
        <div class="control">
          <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-magnifying-glass"></use></svg>
          <label class="sr-only" for="nf-q">Buscar vacantes por puesto, empresa o tecnología</label>
          <input class="input" id="nf-q" name="q" type="search" placeholder="Busca una vacante">
        </div>
        <button class="btn btn--ghost" type="submit"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-magnifying-glass"></use></svg>Buscar</button>
      </form>
    </div>
  </main>
  <script type="module" src="js/layout.js"></script>
</body>
</html>
